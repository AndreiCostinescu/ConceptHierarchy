name: Lint

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.15.17

      - name: Check formatting
        uses: AndreiCostinescu/DevTools/.github/actions/check-ruff@8f494acab0a2ca9ac9bc6abba11acc0dbde0c453
