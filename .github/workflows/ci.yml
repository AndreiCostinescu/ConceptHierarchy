name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Check Apache license headers
        run: |
          MISSING=0
          for f in $(find src tests -name "*.py"); do
            if ! grep -q "Licensed under the Apache License, Version 2.0" "$f"; then
              echo "Missing license header: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "One or more files are missing the Apache 2.0 license header."
            exit 1
          fi

      - name: Run tests
        run: pytest tests/ --cov=concept_hierarchy --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true  # don't fail build if codecov is unavailable
