name: DCO Check

# Enforces the Developer Certificate of Origin (DCO):
# every commit in a PR must contain a "Signed-off-by:" trailer,
# added automatically with `git commit -s`.
on:
  pull_request:
    branches: ["main"]

jobs:
  dco:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # post a helpful comment when DCO is missing
      statuses: write

    steps:
      - name: DCO Enforcement
        uses: dcodx/dco@v2
        with:
          # Allow the merge-commit created by GitHub itself to bypass the check.
          require-sign-off: true
          # Members of the allowlist bypass the check (useful for bots).
          allowlist: "dependabot[bot],github-actions[bot]"
